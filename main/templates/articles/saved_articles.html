{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Articles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .article-card {
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .article-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
        }

        .article-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        .article-title:hover {
            color: #000000;
        }

        .article-body {
            font-size: 1rem;
            color: #6c757d;
            line-height: 1.6;
        }

        .article-meta {
            font-size: 0.9rem;
            color: #adb5bd;
            margin-top: 10px;
        }

        .container {
            max-width: 900px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">NBALab</a>
        <a class="btn btn-outline-light" href="{% url 'profile' %}">Back to Profile</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">Saved Articles</h2>

    <div class="row">
        {% for article in saved_articles %}
            <div class="col-md-6 mb-4">
                <div class="card article-card">
                    <a href="{% url 'article_url' article.title %}">
                        <img src="{{ article.image.url }}" alt="Article Image" class="article-img">
                    </a>
                    <div class="card-body">
                        <h3 class="article-title">
                            <a href="{% url 'article_url' article.title %}" class="text-decoration-none">
                                {{ article.title }}
                            </a>
                        </h3>
                        <p class="article-body">{{ article.body|truncatewords:20 }}</p>
                        <div class="article-meta">
                            <span>By {{ article.author.username }} | {{ article.time|date:"M d, Y" }}</span>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <p class="text-center text-muted">No saved articles yet.</p>
        {% endfor %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
