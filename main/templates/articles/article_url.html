{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        nav {
            border-bottom: 2px solid #343a40;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
        }
        .navbar-text {
            font-size: 1.2rem;
        }
        .article-img {
            width: 80%;
            height: auto;
            margin: 20px auto;
            display: block;
            border-radius: 8px;
        }
        .article-title {
            font-size: 2rem;
            font-weight: 700;
            color: #343a40;
            text-align: center;
            margin-top: 20px;
        }
        .article-body {
            font-size: 1.25rem;
            color: #495057;
            line-height: 1.8;
            margin-top: 20px;
            padding: 0 15px;
        }
        .article-meta {
            font-size: 1rem;
            color: #adb5bd;
            margin-top: 40px;
            text-align: center;
        }
        .btn-info {
            background-color: #17a2b8;
            border-color: #17a2b8;
            color: white;
        }
        .btn-info:hover {
            background-color: #138496;
            border-color: #138496;
        }
        .container {
            padding: 30px 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">NBALab</a>
            <div class="mx-auto text-white">
                <h2 class="navbar-text mb-0">Article Detail</h2>
            </div>
            <a href="{% url 'my_articles' %}" class="btn btn-info">My Articles</a>
        </div>
    </nav>
    <div class="container mt-5">
        {% if article.image %}
            <img src="{{ article.image.url }}" alt="Article Image" class="article-img">
        {% else %}
            <img src="{% static 'images/default_article.jpg' %}" alt="Default Image" class="article-img">
        {% endif %}
        <h1 class="article-title">{{ article.title }}</h1>
        <div class="article-body">
            <p>{{ article.body }}</p>
        </div>
        <div class="article-meta">
            <p>Written by <strong>{{ article.author.username }}</strong> | Published on {{ article.time|date:"M d, Y" }}</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
