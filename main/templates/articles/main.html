{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/articles.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        nav {
            border-bottom: 2px solid #343a40;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.8rem;
        }
        .navbar-text {
            font-size: 1.4rem;
        }
        .article-card {
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .article-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        .article-img {
            width: 100%;
            height: auto;
            border-radius: 8px 8px 0 0;
            object-fit: cover;
        }
        .article-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: #343a40;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .article-body {
            font-size: 1.05rem;
            color: #6c757d;
            line-height: 1.6;
        }
        .article-card-body {
            padding: 20px;
        }
        .article-meta {
            font-size: 0.9rem;
            color: #adb5bd;
            margin-top: 10px;
        }
        .btn-info {
            background-color: #17a2b8;
            border-color: #17a2b8;
            color: white;
        }
        .btn-info:hover {
            background-color: #138496;
            border-color: #138496;
        }
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">NBALab</a>
            <div class="mx-auto text-white">
                <h2 class="navbar-text mb-0">All Articles</h2>
            </div>
            <a href="{% url 'my_articles' %}" class="btn btn-info">My Articles</a>
        </div>
    </nav>
   <div class="container mt-5">
        <div class="article-grid">
            {% for article in articles %}
                <div class="card article-card shadow-sm">
                    {% if article.image %}
                        <img src="{{ article.image.url }}" alt="Article Image" class="article-img">
                    {% else %}
                        <img src="{% static 'images/default_article.jpg' %}" alt="Default Image" class="article-img">
                    {% endif %}

                    <div class="card-body article-card-body">
                        <h3 class="article-title">{{ article.title }}</h3>
                        <p class="article-body">{{ article.body|truncatewords:30 }}</p>
                        <div class="article-meta">
                            <span>By {{ article.author.username }} | {{ article.time|date:"M d, Y" }}</span>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
