{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Article</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <h2 class="text-center mb-3">Upload New Article</h2>
            {% if messages %}
                <div class="alert alert-success">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
            <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="title" class="form-label">Article Title</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label for="image" class="form-label">Article Image</label>
                    {{ form.image }}
                </div>
                <div class="mb-3">
                    <label for="body" class="form-label">Article Body</label>
                    {{ form.body }}
                </div>
                <button type="submit" class="btn btn-dark w-100">Submit Article</button>
            </form>
            <a href="{% url 'my_articles' %}" class="btn btn-secondary w-100 mt-3">Back to My Articles</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
