{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .article-img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <div class="card shadow-lg p-4 mx-auto bg-secondary" style="max-width: 600px;">
            <h2 class="text-center mb-3">Edit Article</h2>
            {% if messages %}
                <div class="alert alert-success">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
            <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                {% csrf_token %}
                {% if article.image %}
                    <img src="{{ article.image.url }}" alt="Article Image" class="article-img">
                {% endif %}
                <div class="mb-3">
                    <label for="image" class="form-label">Change Article Image</label>
                    <input type="file" name="image" id="image" class="form-control" accept="image/*">
                </div>
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" name="title" id="title" class="form-control" value="{{ article.title }}" required>
                </div>
                <div class="mb-3">
                    <label for="body" class="form-label">Body</label>
                    <textarea name="body" id="body" class="form-control" rows="5" required>{{ article.body }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>

            <a href="{% url 'my_articles' %}" class="btn btn-secondary w-100 mt-3">Back to My Articles</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
