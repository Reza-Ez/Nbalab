{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .profile-pic img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 10px auto;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto text-center" style="max-width: 500px;">
            <h2 class="mb-3">Profile</h2>

            <div class="profile-pic">
                {% if profile.profile_pic %}
                    <img src="{{ profile.profile_pic.url }}" alt="Profile Picture">
                {% else %}
                    <img src="{% static 'images/default_profile.jpg' %}" alt="Default Profile Picture">
                {% endif %}
            </div>

            <p><strong>Username:</strong> {{ user.username }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Name:</strong> {{ profile.name }}</p>
            <p><strong>Age:</strong> {{ profile.age }}</p>
            <p><strong>Phone Number:</strong> {{ profile.phone_number }}</p>
            <p><strong>Bio:</strong> {{ profile.bio }}</p>

            <a href="{% url 'Edit_Profile' %}" class="btn btn-primary w-100">Edit Profile</a>
            <a href="{% url 'logout' %}" class="btn btn-danger w-100 mt-3">Log Out</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
