{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'styles/editprofile.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .profile-pic img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 10px auto;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <h2 class="text-center mb-3">Edit Profile</h2>

            {% if messages %}
                <div class="alert alert-success">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                {% csrf_token %}

                <!-- Profile Picture -->
                {% if profile.profile_pic %}
                    <div class="profile-pic text-center">
                        <img src="{{ profile.profile_pic.url }}" alt="Profile Picture" id="profile-preview">
                    </div>
                {% endif %}

                <!-- Profile Picture Upload -->
                <div class="mb-3">
                    <label for="profile_pic" class="form-label">Change Profile Picture</label>
                    <input type="file" name="profile_pic" id="profile_pic" class="form-control" accept="image/*" onchange="previewImage(event)">
                </div>

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>

            <a href="{% url 'profile' %}" class="btn btn-secondary w-100 mt-3">Back to Profile</a>
        </div>
    </div>

    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function(){
                var output = document.getElementById('profile-preview');
                if (!output) {
                    var img = document.createElement("img");
                    img.id = "profile-preview";
                    img.src = reader.result;
                    img.classList.add("img-thumbnail", "mx-auto", "d-block");
                    img.style.width = "150px";
                    img.style.height = "150px";
                    img.style.borderRadius = "50%";
                    document.querySelector('.profile-pic').appendChild(img);
                } else {
                    output.src = reader.result;
                }
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
